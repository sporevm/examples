steps:
  - label: ":package: Build Rails RSpec ARM64 image"
    key: rails-rspec-arm64-build
    if: build.env("SPOREVM_RAILS_BUILD_LOCAL") == "1"
    agents:
      queue: sporevm-linux-arm64
    timeout_in_minutes: 60
    command: |
      set -euo pipefail

      case "$$(uname -m)" in arm64|aarch64) ;; *) echo "worker is not ARM64" >&2; exit 1 ;; esac
      image_tag="sporevm-examples-rails-rspec:$${BUILDKITE_JOB_ID}"
      capture_name="sporevm-examples-capture-$${BUILDKITE_JOB_ID%%-*}"

      cleanup() {
        docker rm -f "$${capture_name}" >/dev/null 2>&1 || true
        docker image rm -f "$${image_tag}" >/dev/null 2>&1 || true
      }
      trap cleanup EXIT
      cleanup

      docker build -t "$${image_tag}" rails
      test "$$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$${image_tag}")" = "linux/arm64"
      docker run --rm \
        --entrypoint /usr/local/bin/ruby \
        --env SPOREVM_RSPEC_SHARD_PATH=/usr/local/bin/sporevm-rspec-shard \
        --volume "$${PWD}/tests/test_sporevm_rspec_shard.rb:/tmp/test_sporevm_rspec_shard.rb:ro" \
        "$${image_tag}" \
        /tmp/test_sporevm_rspec_shard.rb
      docker run -d \
        --name "$${capture_name}" \
        "$${image_tag}" \
        /bin/bash /usr/local/bin/sporevm-rails-coordinator --capture-delay 1 >/dev/null
      capture_ready=0
      for attempt in $$(seq 1 300); do
        capture_output="$$(docker logs "$${capture_name}" 2>&1)"
        if grep -Eq '^SPOREVM_RAILS_READY pid=[0-9]+ capture_delay=1$$' <<<"$${capture_output}"; then
          capture_ready=1
          break
        fi
        test "$$(docker inspect --format '{{.State.Running}}' "$${capture_name}")" = true
        sleep 0.1
      done
      test "$${capture_ready}" -eq 1
      sleep 2
      capture_output="$$(docker logs "$${capture_name}" 2>&1)"
      printf '%s\n' "$${capture_output}"
      test "$$(docker inspect --format '{{.State.Running}}' "$${capture_name}")" = true
      test "$$(grep -Ec '^SPOREVM_POSTGRES_SEED state=stopped duration_ms=[0-9]+$$' <<<"$${capture_output}")" -eq 1
      test "$$(grep -Ec '^SPOREVM_RAILS_READY pid=[0-9]+ capture_delay=1$$' <<<"$${capture_output}")" -eq 1
      ! grep -Fq 'SPOREVM_RAILS_RESUMED' <<<"$${capture_output}"
      test "$$(grep -n '^SPOREVM_POSTGRES_SEED ' <<<"$${capture_output}" | cut -d: -f1)" -lt \
        "$$(grep -n '^SPOREVM_RAILS_READY ' <<<"$${capture_output}" | cut -d: -f1)"
